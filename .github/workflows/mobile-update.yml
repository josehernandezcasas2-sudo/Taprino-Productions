# The cloud version of the app: every push to main that touches mobile/
# publishes the JS bundle to EAS Update (branch "preview"), so the current
# app can be opened in Expo Go from anywhere without the dev server at home.
# Needs one repository secret, EXPO_TOKEN (expo.dev → account → Access
# tokens), and the project linked once with `npx eas-cli@latest init` +
# `npx eas-cli@latest update:configure` (writes extra.eas.projectId and
# updates.url into mobile/app.json). See mobile/README.md.
name: Mobile · publish update

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-update.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update branch. preview = Expo Go; production = the Google Play build (mobile/PLAY_STORE.md).'
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: mobile-update
  cancel-in-progress: false

jobs:
  update:
    name: eas update (preview)
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'josehernandezcasas2-sudo' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      # mobile/.env (committed: it holds only Clerk's publishable key) is
      # sourced into the step so the EXPO_PUBLIC_* values are inlined into
      # the bundle. With --environment, EAS CLI ignores .env files and
      # takes variables from expo.dev instead, which is why the first
      # publishes came out without the key; no --environment here.
      # Pushes go to the preview branch (Expo Go). A manual run can pick
      # production, which the Google Play build is on: only publish there
      # on purpose, since installed apps pick it up on their next launch.
      - name: Publish the update
        working-directory: mobile
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'manual run' }}
          BRANCH: ${{ inputs.branch || 'preview' }}
        run: |
          set -a; . ./.env; set +a
          MSG="${COMMIT_MESSAGE%%$'\n'*}"
          eas update --branch "$BRANCH" --message "${MSG:0:120}" --non-interactive
